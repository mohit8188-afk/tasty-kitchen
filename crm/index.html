{display:flex;gap:7px;overflow-x:auto;padding:15px 1px 8px;scrollbar-width:none;position:sticky;top:0;background:#fbf6f0ed;backdrop-filter:blur(12px);z-index:2}.tabs button{white-space:nowrap;flex-shrink:0;background:#fff;border:1px solid #e9d9d1;color:#6c4c54;padding:11px 16px}.tabs button.active{color:#fff;background:#642b39;box-shadow:0 6px 14px #642b392b}.muted{color:#806d71;font-size:13px}.pill{font-size:12px;background:#f5e9df;padding:5px 9px;border-radius:25px}.item{padding:14px 3px;border-bottom:1px solid #f0e4df;transition:background .16s}.item:hover{background:#fffbf7}.item:last-child{border:0}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{border:1px solid #efdcd0;border-radius:18px;background:#fffefa;padding:18px;box-shadow:0 8px 22px #6c273010;animation:rise .4s both;transition:transform .2s,box-shadow .2s;cursor:pointer}.metric:hover{transform:translateY(-4px);box-shadow:0 14px 26px #6c273024}.metric:nth-child(2){animation-delay:.07s}.metric:nth-child(3){animation-delay:.14s}.metric:nth-child(4){animation-delay:.21s}.metric .iconball{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#f8e9e1;font-size:19px;margin-bottom:10px}.metric .stat{font-size:31px;font-weight:780;line-height:1.1;color:#4b1e2b;letter-spacing:-1px;margin:5px 0}.metric .label{font-size:12px;color:#826a6c;font-weight:650}.action-title{font-weight:750;margin:18px 0 8px;font-size:14px}.quicklinks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quicklinks button{background:#fff;border:1px solid #ead6ce;color:#502332;text-align:left;padding:15px;border-radius:15px}.quicklinks small{display:block;color:#987f80;font-weight:400;margin-top:5px}.hide{display:none!important}.notice{background:#fff0d7;padding:12px;border-radius:10px;color:#795324;font-size:12px}label{display:block;font-size:13px;margin:10px 0 5px}small{font-size:12px}.empty{display:grid;gap:8px;place-items:center;padding:30px 10px;color:#92777a;text-align:center}.empty span{font-size:30px}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(min-width:750px){.summary{grid-template-columns:repeat(5,1fr)}.quicklinks{grid-template-columns:repeat(4,1fr)}.hero{padding:32px 35px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 .order-toolbar{background:#fffefa;border:1px solid #eeddd5;border-radius:18px;padding:18px;margin:12px 0}.order-toolbar h2{margin:0 0 5px}.order-toolbar .select-all{display:inline-flex;align-items:center;gap:9px;margin:8px 14px 0 0}.order-toolbar input[type=checkbox],.order-choice input{width:19px;height:19px;accent-color:#632534}.order-toolbar button:disabled{opacity:.5;cursor:not-allowed}.order-list{padding:8px 20px}.order-detail{padding:18px 0;border-bottom:1px solid #e9d9d1}.order-detail:last-child{border:0}.order-header{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.order-person{display:flex;flex-direction:column;gap:5px;font-size:16px}.order-phone{font-weight:500;font-size:14px;color:#73565c}.order-status{font-size:12px;background:#f4ebe3;border-radius:999px;padding:7px 11px;text-transform:capitalize}.order-food{margin:12px 0;font-weight:600}.order-food-line{margin:5px 0}.order-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#715c60}.order-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}.order-choice{display:inline-flex;gap:8px;align-items:center}.order-actions button{padding:9px 13px}@media(max-width:550px){.order-header{flex-direction:column}.order-toolbar button{margin-top:10px;width:100%}} .fulfil-card{padding:18px 8px;border-bottom:1px solid #ecd9d0}.fulfil-card p{margin:7px 0}.fulfil-card button{margin-top:9px} .production-sheet{border:2px solid #e1b986}.production-sheet>label{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 16px 12px 0}.production-sheet>label input{width:auto}.production-table{border-collapse:collapse;width:100%;margin:13px 0}.production-table td,.production-table th{padding:12px 9px;text-align:left;border-bottom:1px solid #e7dbd1}.production-table th{background:#f4e5d9}.production-table td:nth-child(n+3){font-weight:700}@media print{body{background:white}body header,body .tabs,body #alert,.production-sheet>label,.production-sheet>button,.hero,.summary,.fulfil-card,.production-sheet~.card{display:none!important}.production-sheet{border:0!important;box-shadow:none!important}.production-sheet .production-content{display:block!important}main{padding:0!important}} </style>
</head><body><header><h1>Tasty Kitchen <small>CRM</small></h1><button id="logout" class="secondary hide">Sign out</button></header><main>
<div id="alert" role="status" aria-live="polite"></div>
<section class="card" id="login"><h2>Staff sign-in</h2><p class="muted">Authorized Tasty Kitchen administrators only. A one-time email link is required.</p><label for="email">Admin email</label><input id="email" type="email" autocomplete="email" placeholder="admin@example.com"><button id="send">Send sign-in link</button></section>
<section id="workspace" class="hide"><nav class="tabs" id="nav"><button data-view="dashboard">Dashboard</button><button data-view="kitchen">Kitchen & Delivery</button><button data-view="analytics">Analytics</button><button data-view="contacts">Contacts</button><button data-view="orders">Orders</button><button data-view="gifting">Gifting</button><button data-view="tasks">Follow-ups</button><button data-view="support">AI support</button></nav><div id="contents"></div></section>
</main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const config=window.TK_CRM_CONFIG; // injected from a separately managed, public-key-only config file
const alertEl=document.querySelector("#alert"),login=document.querySelector("#login"),work=document.querySelector("#workspace"),content=document.querySelector("#contents");
const el=(tag,txt,cl)=>{const a=document.createElement(tag);if(txt!==undefined)a.textContent=String(txt??"");if(cl)a.className=cl;return a};
const clear=()=>content.replaceChildren();
const status=(text)=>alertEl.replaceChildren(el("p",text,"notice"));
const fmt=v=>v?new Date(v).toLocaleString("en-IN"):"—";
let client,token,selectedView="dashboard";
if(!config?.url||!config?.anonKey||!config?.functionsUrl){status("CRM configuration is incomplete. Staff access is not enabled.");document.querySelector("#send").disabled=true}
else{client=createClient(config.url,config.anonKey);client.auth.onAuthStateChange(async(event,session)=>{token=session?.access_token;login.classList.toggle("hide",!!token);work.classList.toggle("hide",!token);document.querySelector("#logout").classList.toggle("hide",!token);if(token)await loadView(["tasting","upi"].includes(selectedView)?"dashboard":selectedView)}); }
document.querySelector("#send").onclick=async()=>{if(!client)return;const email=document.querySelector("#email").value.trim();if(!email)return status("Enter a valid email.");const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});status(error?"Sign-in unavailable. Contact administrator.":"Check your email for the sign-in link.")};
document.querySelector("#logout").onclick=()=>client?.auth.signOut();
document.querySelector("#nav").onclick=e=>{const v=e.target.dataset.view;if(v)loadView(v)};
async function api(action,params={},body){const url=new URL(config.functionsUrl);url.searchParams.set("action",action);for(const [k,v] of Object.entries(params))url.searchParams.set(k,v);const res=await fetch(url,{method:body?"POST":"GET",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json",apikey:config.anonKey},body:body?JSON.stringify(body):undefined,cache:"no-store"});if(!res.ok)throw Error("Request denied or unavailable ("+res.status+").");return res.json()}
function item(text,detail,click){const div=el("div",undefined,"item"),a=el("strong",text),b=el("div",detail,"muted");div.append(a,b);if(click){div.tabIndex=0;div.onclick=click;div.onkeydown=e=>{if(e.key==="Enter")click()}}return div}
async function loadView(view){selectedView=view;document.querySelectorAll("#nav button").forEach(b=>{b.classList.toggle("active",b.dataset.view===view);b.setAttribute("aria-current",b.dataset.view===view?"page":"false")});clear();content.append(el("p","Loading…","muted"));try{if(view==="dashboard"){const [d,op]=await Promise.all([api("dashboard"),api("operations")]);clear();
const hero=el("section",undefined,"hero");hero.append(el("div","✦ YOUR KITCHEN AT A GLANCE","eyebrow"),el("h2","Today's kitchen, made simple"),el("p","Everything needing your attention, in one place."));content.append(hero);
const metrics=[
{label:"Today’s sales",value:"₹"+Number(d.counts?.today_sales_inr??0).toLocaleString("en-IN"),icon:"💰",view:"orders"},
{label:"Orders to prepare",value:op.preparing??0,icon:"🧑‍🍳",view:"kitchen"},
{label:"Tomorrow’s orders",value:op.tomorrow_orders??0,icon:"🚚",view:"kitchen"},
{label:"Gifting enquiries",value:d.counts?.gifting_inquiries??0,icon:"🎁",view:"gifting"},
{label:"Follow-ups due",value:d.counts?.overdue_tasks??0,icon:"🔔",view:"tasks"}];
const box=el("div",undefined,"summary");for(const m of metrics){const card=el("div",undefined,"metric");card.append(el("div",m.icon,"iconball"),el("div",m.value,"stat"),el("div",m.label,"label"));card.tabIndex=0;card.setAttribute("role","button");card.onclick=()=>loadView(m.view);card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();loadView(m.view)}};box.append(card)}content.append(box,el("p","Sales count only verified live paid orders, by India time. Test and unpaid orders are excluded.","muted"));
content.append(el("div","Quick actions","action-title"));const quick=el("div",undefined,"quicklinks");for(const [name,sub,view] of [["📦 Orders","Manage fulfilment","orders"],["👩‍🍳 Kitchen","Production & delivery","kitchen"],["👥 Customers","Find a customer","contacts"],["📋 Follow-ups","See your tasks","tasks"],["📈 Analytics","Visitors & conversion","analytics"]]){const btn=el("button",name);btn.append(el("small",sub));btn.onclick=()=>loadView(view);quick.append(btn)}content.append(quick);return}
if(view==="kitchen"){
 const d=await api("operations");clear();
 const hero=el("section",undefined,"hero");hero.append(el("div","PRODUCTION & DELIVERY","eyebrow"),el("h2","Tomorrow's kitchen plan"),el("p","Only verified paid orders are included. Review before preparing."));content.append(hero);
 const box=el("div",undefined,"summary");for(const [label,val] of [["Tomorrow's orders",d.tomorrow_orders],["Ready to prepare",d.preparing],["In production / dispatch",d.awaiting_dispatch],["Open gifting enquiries",d.open_gifting]]){const card=el("div",undefined,"metric");card.append(el("div",val,"stat"),el("div",label,"label"));box.append(card)}content.append(box);
 const planner=el("section",undefined,"card production-sheet");
 const heading=el("h2","Kitchen preparation sheet");
 const pickerLabel=el("label","Prepare for delivery date: ");
 const picker=el("input");picker.type="date";picker.min=d.today;picker.value=d.tomorrow;
 const printBtn=el("button","Print preparation sheet");printBtn.className="secondary";
 const sheet=el("div",undefined,"production-content");
 function drawSheet(){
  sheet.replaceChildren();
  const date=picker.value;
  const matches=(d.upcoming||[]).filter(o=>o.delivery_date===date);
  const totals=new Map();
  for(const order of matches)for(const line of order.items||[]){
   const key=(line.product_name||"Unknown sweet")+"|"+Number(line.pack_grams||0);
   const existing=totals.get(key)||{name:line.product_name||"Unknown sweet",grams:Number(line.pack_grams||0),boxes:0};
   existing.boxes+=Number(line.quantity||0);totals.set(key,existing);
  }
  const rows=[...totals.values()].sort((a,b)=>a.name.localeCompare(b.name)||a.grams-b.grams);
  sheet.append(el("h3","Preparation for "+date),el("p",matches.length+" paid orders · "+rows.reduce((s,x)=>s+x.boxes,0)+" boxes · "+(rows.reduce((s,x)=>s+x.boxes*x.grams,0)/1000).toFixed(2)+" kg total packed weight","muted"));
  const table=el("table");table.className="production-table";const head=el("tr");for(const label of ["Sweet","Pack","Boxes","Total weight"])head.append(el("th",label));table.append(head);
  for(const row of rows){const tr=el("tr");for(const value of [row.name,row.grams+" g",row.boxes,(row.grams*row.boxes/1000).toFixed(2)+" kg"])tr.append(el("td",value));table.append(tr)}
  if(rows.length)sheet.append(table);else sheet.append(el("p","No active paid orders for this delivery date.","muted"));
  sheet.append(el("p","Based on confirmed payments, excluding delivered/cancelled orders. Figures are finished packed weights, not ingredient quantities.","muted"));
 }
 picker.onchange=drawSheet;printBtn.onclick=()=>window.print();
 pickerLabel.append(picker);planner.append(heading,pickerLabel,printBtn,sheet);content.append(planner);drawSheet();
 const list=el("section",undefined,"card");list.append(el("h2","Upcoming paid orders — by delivery date"));
 for(const o of d.upcoming||[]){
  const card=el("article",undefined,"fulfil-card");card.append(el("strong",(o.customer_name||"Customer")+" • "+(o.customer_mobile||"—")),el("p",(o.items||[]).map(x=>x.quantity+" × "+x.product_name+" "+x.pack_grams+"g").join(", ")||"Item detail unavailable","muted"),el("p","Delivery: "+(o.delivery_date||"—")+" • "+(o.delivery_scope||"—")+" • "+o.order_ref,"muted"),el("p",[o.delivery_address,o.delivery_pincode].filter(Boolean).join(" · "),"muted"),el("p","₹"+Number(o.total_amount||0)+" · "+o.order_status,"muted"));
  const next={confirmed:"preparing",preparing:"packed",packed:"out_for_delivery",out_for_delivery:"delivered"}[o.order_status];
  if(next){const button=el("button",next==="preparing"?"Start preparing":"Mark "+next.replaceAll("_"," "));button.onclick=async()=>{if(!confirm("Update "+o.order_ref+" to "+next+"?"))return;button.disabled=true;try{await api("order_transition",{}, {order_id:o.id,to_status:next});await loadView("kitchen")}catch(e){status(e.message);button.disabled=false}};card.append(button)}list.append(card);
 }
 if(!(d.upcoming||[]).length)list.append(el("p","No paid orders awaiting fulfilment.","muted"));content.append(list);return;
}
if(view==="analytics"){
 const days=Number(sessionStorage.getItem("tkAnalyticsDays")||7);
 const d=await api("analytics",{days});clear();content.append(el("h2","Website analytics"),el("p","Tracked events and sessions. Includes earlier tests; not unique visitors or exact dwell time.","muted"));
 const select=el("select");for(const value of [7,30,90]){const opt=el("option",value+" days");opt.value=value;opt.selected=value===days;select.append(opt)}select.onchange=()=>{sessionStorage.setItem("tkAnalyticsDays",select.value);loadView("analytics")};content.append(select);
 const box=el("div",undefined,"summary");for(const [label,value] of [["Page views",d.page_views],["Tracked sessions",d.sessions],["Product opens",d.product_opens],["Checkout starts",d.checkout_starts],["Verified live sales","₹"+Number(d.verified_revenue||0).toLocaleString("en-IN")]]){const card=el("div",undefined,"metric");card.append(el("div",value,"stat"),el("div",label,"label"));box.append(card)}content.append(box);
 for(const [title,rows] of [["Event activity",d.event_counts],["Popular products",d.product_counts],["Traffic sources",d.sources],["Page paths",d.pages]]){const section=el("section",undefined,"card");section.append(el("h2",title));for(const row of rows||[])section.append(item(row.name,row.count+" events"));if(!(rows||[]).length)section.append(el("p","No tracked events in this period.","muted"));content.append(section)}
 if(d.capped)content.append(el("p","Large event volume: only the latest 10,000 tracked events are included.","muted"));return;
}
if(view==="upi"){
  const data=await api("upi_pending");clear();
  content.append(el("h2","UPI bank verification"),el("p","Awaiting verification: "+data.pending_count+" · Customer marked paid: "+data.reported_count+". Open your receiving bank or UPI account and check each actual credit before confirming.","muted"));
  const box=el("section",undefined,"card");
  if(!(data.rows||[]).length)box.append(el("p","No pending UPI payments.","muted"));
  for(const r of data.rows||[]){
    const itemBox=el("div",undefined,"item");
    itemBox.append(el("strong",(r.kind==="sample"?"🍬 Sample ":"📦 Order ")+r.ref+" · ₹"+Number(r.payable_amount).toFixed(2)));
    itemBox.append(el("p",(r.customer?r.customer+" · ":"")+(r.mobile||"")+(r.detail?" · "+r.detail:"")+" · "+(r.reported_at?"Customer marked paid":"Customer has not marked paid"),"muted"));
    itemBox.append(el("p","Base ₹"+Number(r.base_amount).toFixed(2)+" · Unique match ₹"+(Number(r.payable_amount)-Number(r.base_amount)).toFixed(2)+" · Created "+fmt(r.created_at),"muted"));
    const evidence=el("input");evidence.placeholder="Bank transaction reference (from receiving account)";evidence.autocomplete="off";evidence.maxLength=500;
    evidence.setAttribute("aria-label","Verified bank transaction reference for "+r.ref);
    const actions=el("div");actions.style.display="flex";actions.style.flexWrap="wrap";actions.style.gap="8px";
    for(const [decision,label] of [["verified_paid","Verify bank credit"],["rejected","Reject payment claim"]]){
      const btn=el("button",label);if(decision==="rejected")btn.className="secondary";
      btn.onclick=async()=>{
        const proof=evidence.value.trim();
        if(proof.length<8){status("Enter the actual bank reference or clear review reason (8+ characters).");evidence.focus();return}
        if(decision==="verified_paid"&&!r.reported_at&&!confirm("Customer has not marked paid. Verify the bank credit independently before proceeding."))return;
        if(!confirm((decision==="verified_paid"?"Confirm verified ₹":"Reject claimed ₹")+Number(r.payable_amount).toFixed(2)+" for "+r.ref+"? This is recorded in the payment audit."))return;
        btn.disabled=true;
        try{
          await api("upi_review",{}, {kind:r.kind,id:r.id,amount_paise:Math.round(Number(r.payable_amount)*100),decision,bank_evidence:proof});
          status(r.ref+": bank review recorded.");await loadView("upi");
        }catch(err){status(err.message||"Payment review failed");btn.disabled=false}
      };
      actions.append(btn);
    }
    itemBox.append(evidence,actions);box.append(itemBox);
  }
  content.append(box,el("p","Exact amount is an aid to matching, not proof. Confirm actual account credit, sender, time, and bank reference. Never verify from the shopper button alone.","muted"));return;
 }
 if(view==="support"){clear();content.append(el("h2","Customer support studio"),el("p","Review a suggested reply for a selected customer. No message is sent automatically.","muted"));
const selector=el("select"),placeholder=el("option","Select a customer");placeholder.value="";selector.append(placeholder);
const contacts=await api("contacts");for(const c of contacts.contacts||[]){const option=el("option",(c.name||"Customer")+" · "+(c.mobile||""));option.value=c.id;selector.append(option)}
const question=el("textarea");question.placeholder="Ask about an order, payment, tasting, gifting, delivery or product prices";question.rows=3;
const result=el("section",undefined,"card"),draftButton=el("button","Prepare reply");const handoff=el("button","Create human follow-up");handoff.className="secondary";handoff.disabled=true;
let last=null;draftButton.onclick=async()=>{if(!selector.value||!question.value.trim())return status("Select a customer and enter a question.");try{last=await api("support_draft",{}, {contact_id:selector.value,question:question.value});result.replaceChildren(el("h2","Suggested response"),el("p",last.draft),el("p","Topic: "+last.topic+" · "+(last.human_handoff_recommended?"Team review recommended":"Ready for staff review")+" · Not sent","muted"));handoff.disabled=false}catch(e){status(e.message)}};
handoff.onclick=async()=>{if(!last||!selector.value)return;try{await api("support_handoff",{}, {contact_id:selector.value,question:question.value});status("A follow-up task was created for staff.");handoff.disabled=true}catch(e){status(e.message)}};
const panel=el("section",undefined,"card");panel.append(el("h2","Prepare a customer reply"),el("label","Customer"),selector,el("label","Customer question"),question,draftButton,el("span"," "),handoff);
selector.onchange=()=>{last=null;handoff.disabled=true;result.replaceChildren()};
question.oninput=()=>{last=null;handoff.disabled=true;result.replaceChildren()};
content.append(panel,result);return}
if(view==="contacts"){clear();const input=el("input");input.placeholder="Search name or mobile";content.append(input);const list=el("section",undefined,"card");content.append(list);let seq=0;async function search(){const stamp=++seq;const d=await api("contacts",{q:input.value});if(stamp!==seq)return;list.replaceChildren(...(d.contacts||[]).map(c=>item(c.name||"Customer",c.mobile+" • "+(c.lifecycle_stage||"lead"),()=>showContact(c.id))))}input.oninput=()=>search().catch(e=>status(e.message));await search();return}
if(view==="orders"){
 const d=await api("orders");clear();
 const rows=d.rows||[];
 const ready=rows.filter(r=>r.payment_environment==="live"&&r.payment_status==="paid"&&r.order_status==="confirmed");
 const selected=new Set();
 const toolsBar=el("div",undefined,"order-toolbar");
 const title=el("h2","Kitchen orders");
 const summary=el("p",ready.length+" confirmed orders ready for preparation • "+rows.length+" live orders","muted");
 const batch=el("button","Mark selected as preparing");batch.disabled=true;
 const updateSelection=()=>{batch.disabled=selected.size===0;batch.textContent="Mark "+selected.size+" selected as preparing"};
 const all=el("input");all.type="checkbox";all.setAttribute("aria-label","Select all paid confirmed orders");
 const selectLabel=el("label");selectLabel.className="select-all";selectLabel.append(all,document.createTextNode("Select all ready orders"));
 all.onchange=()=>{selected.clear();if(all.checked)ready.forEach(o=>selected.add(o.id));content.querySelectorAll(".order-select").forEach(e=>{e.checked=selected.has(e.value)});updateSelection()};
 batch.onclick=async()=>{if(!selected.size)return;if(!confirm("Start preparing "+selected.size+" confirmed paid orders?"))return;batch.disabled=true;let failures=0;for(const id of selected){try{await api("order_transition",{}, {order_id:id,to_status:"preparing"})}catch{failures++}}await loadView("orders");status(failures?failures+" order(s) could not be updated. Please review them.":"Selected orders moved to preparing.")};
 toolsBar.append(title,summary,selectLabel,batch);content.append(toolsBar);
 const list=el("section",undefined,"card order-list");
 for(const o of rows){
  const tile=el("article",undefined,"order-detail");
  const header=el("div",undefined,"order-header");
  const name=el("strong",o.customer_name||"Customer name unavailable");
  const phone=el("span",o.customer_mobile||"Mobile unavailable","order-phone");
  const ident=el("div",undefined,"order-person");ident.append(name,phone);
  const statusText=el("span",(o.payment_status||"unknown")+" · "+(o.order_status||"created"),"order-status");
  header.append(ident,statusText);tile.append(header);
  const lines=el("div",undefined,"order-food");
  for(const x of o.items||[])lines.append(el("div",(x.quantity||1)+" × "+(x.product_name||"Sweet")+" · "+(x.pack_grams||"—")+"g","order-food-line"));
  if(!(o.items||[]).length)lines.append(el("div","Product details unavailable","muted"));
  tile.append(lines);
  const meta=el("div",undefined,"order-meta");
  meta.append(el("span","₹"+Number(o.total_amount||0).toLocaleString("en-IN")),el("span","Delivery: "+(o.delivery_date||"—")),el("span",o.order_ref||"—"));tile.append(meta);
  const actions=el("div",undefined,"order-actions");
  if(o.payment_status==="paid"&&o.order_status==="confirmed"){
   const check=el("input");check.type="checkbox";check.className="order-select";check.value=o.id;check.setAttribute("aria-label","Select "+o.order_ref+" for preparation");
   check.onchange=()=>{if(check.checked)selected.add(o.id);else selected.delete(o.id);all.checked=ready.length>0&&selected.size===ready.length;updateSelection()};
   const lab=el("label");lab.className="order-choice";lab.append(check,document.createTextNode("Select to prepare"));actions.append(lab);
  }
  const next={confirmed:"preparing",preparing:"packed",packed:"out_for_delivery",out_for_delivery:"delivered"}[o.order_status];
  if(o.payment_status==="paid"&&next){const button=el("button",next==="preparing"?"Start preparing":"Mark "+next.replaceAll("_"," "));button.onclick=async()=>{if(!confirm("Update "+o.order_ref+" to "+next+"?"))return;button.disabled=true;try{await api("order_transition",{}, {order_id:o.id,to_status:next});await loadView("orders")}catch(e){status(e.message);button.disabled=false}};actions.append(button)}
  if(o.contact_id){const detail=el("button","Customer history","secondary");detail.onclick=()=>showContact(o.contact_id);actions.append(detail)}
  if(actions.children.length)tile.append(actions);
  list.append(tile);
 }
 if(!rows.length)list.append(el("p","No live orders yet.","muted"));
 content.append(list);return;
}
const d=await api(view);clear();const list=el("section",undefined,"card");let rows=d.rows||[];if(view==="tasks")rows=rows.sort((a,b)=>(a.due_at||"9999").localeCompare(b.due_at||"9999"));for(const r of rows){const ref=r.order_ref||r.sample_ref||r.gifting_ref||r.title||r.id;const line=[r.status||r.order_status,r.payment_status,r.due_at?fmt(r.due_at):null].filter(Boolean).join(" • ");{const tile=item(ref,line,r.contact_id?()=>showContact(r.contact_id):null);list.append(tile);if(view==="orders"&&r.payment_status==="paid"&&r.payment_environment==="live"&&["confirmed","preparing","packed","out_for_delivery"].includes(r.order_status)){const next={confirmed:"preparing",preparing:"packed",packed:"out_for_delivery",out_for_delivery:"delivered"}[r.order_status];const btn=el("button","Mark "+next.replaceAll("_"," "));btn.onclick=async()=>{if(!confirm("Update live order "+(r.order_ref||r.id)+" to "+next+"?"))return;try{await api("order_transition",{}, {order_id:r.id,to_status:next});await loadView("orders")}catch(e){status(e.message)}};tile.append(btn)}}}if(!rows.length){const empty=el("div",undefined,"empty");empty.append(el("span","✨"),el("strong","All clear for now"),el("p","No records need attention in this section.","muted"));list.append(empty)}content.append(list)}
catch(e){clear();status(e.message)}}
async function showContact(id){clear();try{const d=await api("contact",{contact_id:id}),c=d.contact;content.append(el("h2",c.name+" • "+c.mobile),el("p",[c.city,c.locality,c.lifecycle_stage].filter(Boolean).join(" · "),"muted"));const timeline=[];for(const [key,arr,date] of [["samples",d.samples,"created_at"],["orders",d.orders,"created_at"],["gifting",d.gifting,"created_at"],["interactions",d.interactions,"created_at"],["reviews",d.reviews,"submitted_at"],["notes",d.notes,"created_at"],["tasks",d.tasks,"created_at"]])for(const x of arr||[])timeline.push({time:x[date],type:key,label:x.summary||x.body||x.title||x.order_ref||x.product_id||x.business_name||x.event_type||key,detail:x.payment_status||x.status||x.order_status||""});timeline.sort((a,b)=>(b.time||"").localeCompare(a.time||""));const panel=el("section",undefined,"card");panel.append(el("h2","Activity timeline"));for(const t of timeline)panel.append(item(t.type+" · "+t.label,fmt(t.time)+" · "+t.detail));if(!timeline.length)panel.append(el("p","No activity yet."));content.append(panel);
const note=el("section",undefined,"card"),txt=el("textarea");txt.placeholder="Private internal note";const save=el("button","Save note");save.onclick=async()=>{if(!txt.value.trim())return;try{await api("note",{}, {contact_id:id,body:txt.value});await showContact(id)}catch(e){status(e.message)}};note.append(el("h2","Add internal note"),txt,save);content.append(note);
const task=el("section",undefined,"card"),title=el("input"),date=el("input"),add=el("button","Create follow-up");title.placeholder="Follow-up description";date.type="datetime-local";add.onclick=async()=>{try{await api("task",{}, {contact_id:id,title:title.value,due_at:date.value?new Date(date.value).toISOString():null});await showContact(id)}catch(e){status(e.message)}};task.append(el("h2","New follow-up"),title,date,add);content.append(task)}
catch(e){status(e.message)}}
</script><script src="./config.js"></script></body></html>
