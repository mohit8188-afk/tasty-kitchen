<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Tasty Kitchen • Internal CRM</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#321a1d;background:#fff8f2}*{box-sizing:border-box}body{margin:0}header{background:#48151d;color:white;padding:17px;display:flex;justify-content:space-between;align-items:center}main{max-width:1050px;margin:auto;padding:18px}.card{background:white;border:1px solid #ead5ce;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #52201809}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}button,input,select,textarea{font:inherit;border-radius:9px;padding:12px;border:1px solid #d6bbb1}button{cursor:pointer;background:#582028;color:white;border:0}button.secondary{background:#eee0d8;color:#45161b}input,textarea{width:100%}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.tabs button{flex-shrink:0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.muted{color:#755c5d;font-size:13px}.pill{font-size:12px;background:#f5e9df;padding:5px 9px;border-radius:25px}.item{padding:12px 0;border-bottom:1px solid #f0e4df;cursor:pointer}.item:last-child{border:0}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:24px;font-weight:750}.actions{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none}.notice{background:#ffedcd;padding:12px;border-radius:10px}label{display:block;font-size:13px;margin:10px 0 5px}small{font-size:12px}@media(min-width:750px){.summary{grid-template-columns:repeat(5,1fr)}} </style>
</head><body><header><h1>Tasty Kitchen <small>CRM</small></h1><button id="logout" class="secondary hide">Sign out</button></header><main>
<div id="alert" role="status" aria-live="polite"></div>
<section class="card" id="login"><h2>Staff sign-in</h2><p class="muted">Authorized Tasty Kitchen administrators only. A one-time email link is required.</p><label for="email">Admin email</label><input id="email" type="email" autocomplete="email" placeholder="admin@example.com"><button id="send">Send sign-in link</button></section>
<section id="workspace" class="hide"><nav class="tabs" id="nav"><button data-view="dashboard">Dashboard</button><button data-view="contacts">Contacts</button><button data-view="tasting">Tasting</button><button data-view="orders">Orders</button><button data-view="gifting">Gifting</button><button data-view="tasks">Follow-ups</button></nav><div id="contents"></div></section>
</main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const config=window.TK_CRM_CONFIG; // injected from a separately managed, public-key-only config file
const alertEl=document.querySelector("#alert"),login=document.querySelector("#login"),work=document.querySelector("#workspace"),content=document.querySelector("#contents");
const el=(tag,txt,cl)=>{const a=document.createElement(tag);if(txt!==undefined)a.textContent=String(txt??"");if(cl)a.className=cl;return a};
const clear=()=>content.replaceChildren();
const status=(text)=>alertEl.replaceChildren(el("p",text,"notice"));
const fmt=v=>v?new Date(v).toLocaleString("en-IN"):"—";
let client,token,selectedView="dashboard";
if(!config?.url||!config?.anonKey||!config?.functionsUrl){status("CRM configuration is incomplete. Staff access is not enabled.");document.querySelector("#send").disabled=true}
else{client=createClient(config.url,config.anonKey);client.auth.onAuthStateChange(async(event,session)=>{token=session?.access_token;login.classList.toggle("hide",!!token);work.classList.toggle("hide",!token);document.querySelector("#logout").classList.toggle("hide",!token);if(token)await loadView(selectedView)}); }
document.querySelector("#send").onclick=async()=>{if(!client)return;const email=document.querySelector("#email").value.trim();if(!email)return status("Enter a valid email.");const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});status(error?"Sign-in unavailable. Contact administrator.":"Check your email for the sign-in link.")};
document.querySelector("#logout").onclick=()=>client?.auth.signOut();
document.querySelector("#nav").onclick=e=>{const v=e.target.dataset.view;if(v)loadView(v)};
async function api(action,params={},body){const url=new URL(config.functionsUrl);url.searchParams.set("action",action);for(const [k,v] of Object.entries(params))url.searchParams.set(k,v);const res=await fetch(url,{method:body?"POST":"GET",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json",apikey:config.anonKey},body:body?JSON.stringify(body):undefined,cache:"no-store"});if(!res.ok)throw Error("Request denied or unavailable ("+res.status+").");return res.json()}
function item(text,detail,click){const div=el("div",undefined,"item"),a=el("strong",text),b=el("div",detail,"muted");div.append(a,b);if(click){div.tabIndex=0;div.onclick=click;div.onkeydown=e=>{if(e.key==="Enter")click()}}return div}
async function loadView(view){selectedView=view;clear();content.append(el("p","Loading…","muted"));try{if(view==="dashboard"){const d=await api("dashboard");clear();const box=el("div",undefined,"summary");for(const [k,v] of Object.entries(d.counts||{})){const card=el("div",undefined,"card");const names={live_orders:"Live orders",live_paid_orders:"Paid live orders",live_pending_delivery:"Pending deliveries",live_paid_revenue_inr:"Live paid amount (₹)",test_orders:"Test order records",contacts:"Contacts",tasting_requests:"Tasting requests",live_paid_tastings:"Paid live tastings",gifting_inquiries:"Gifting enquiries",open_tasks:"Open follow-ups",overdue_tasks:"Overdue follow-ups"};card.append(el("div",names[k]||k.replaceAll("_"," "),"muted"),el("div",v,"stat"));box.append(card)}content.append(box,el("p",d.notice||"Live financial indicators exclude Razorpay test transactions.","muted"));return}
if(view==="contacts"){clear();const input=el("input");input.placeholder="Search name or mobile";content.append(input);const list=el("section",undefined,"card");content.append(list);let seq=0;async function search(){const stamp=++seq;const d=await api("contacts",{q:input.value});if(stamp!==seq)return;list.replaceChildren(...(d.contacts||[]).map(c=>item(c.name||"Customer",c.mobile+" • "+(c.lifecycle_stage||"lead"),()=>showContact(c.id))))}input.oninput=()=>search().catch(e=>status(e.message));await search();return}
const d=await api(view);clear();if(view==="orders")content.append(el("p","Live orders only. Historical test transactions are preserved but excluded from this operational queue.","notice"));const list=el("section",undefined,"card");let rows=d.rows||[];if(view==="tasks")rows=rows.sort((a,b)=>(a.due_at||"9999").localeCompare(b.due_at||"9999"));for(const r of rows){const ref=r.order_ref||r.sample_ref||r.gifting_ref||r.title||r.id;const line=[r.status||r.order_status,r.payment_status,r.due_at?fmt(r.due_at):null].filter(Boolean).join(" • ");{const tile=item(ref,line,r.contact_id?()=>showContact(r.contact_id):null);list.append(tile);if(view==="orders"&&r.payment_status==="paid"&&r.payment_environment==="live"&&["confirmed","preparing","packed","out_for_delivery"].includes(r.order_status)){const next={confirmed:"preparing",preparing:"packed",packed:"out_for_delivery",out_for_delivery:"delivered"}[r.order_status];const btn=el("button","Mark "+next.replaceAll("_"," "));btn.onclick=async()=>{if(!confirm("Update live order "+(r.order_ref||r.id)+" to "+next+"?"))return;try{await api("order_transition",{}, {order_id:r.id,to_status:next});await loadView("orders")}catch(e){status(e.message)}};tile.append(btn)}}}if(!rows.length)list.append(el("p","No records yet.","muted"));content.append(list)}
catch(e){clear();status(e.message)}}
async function showContact(id){clear();try{const d=await api("contact",{contact_id:id}),c=d.contact;content.append(el("h2",c.name+" • "+c.mobile),el("p",[c.city,c.locality,c.lifecycle_stage].filter(Boolean).join(" · "),"muted"));const timeline=[];for(const [key,arr,date] of [["samples",d.samples,"created_at"],["orders",d.orders,"created_at"],["gifting",d.gifting,"created_at"],["interactions",d.interactions,"created_at"],["reviews",d.reviews,"submitted_at"],["notes",d.notes,"created_at"],["tasks",d.tasks,"created_at"]])for(const x of arr||[])timeline.push({time:x[date],type:key,label:x.summary||x.body||x.title||x.order_ref||x.product_id||x.business_name||x.event_type||key,detail:x.payment_status||x.status||x.order_status||""});timeline.sort((a,b)=>(b.time||"").localeCompare(a.time||""));const panel=el("section",undefined,"card");panel.append(el("h2","Activity timeline"));for(const t of timeline)panel.append(item(t.type+" · "+t.label,fmt(t.time)+" · "+t.detail));if(!timeline.length)panel.append(el("p","No activity yet."));content.append(panel);
const note=el("section",undefined,"card"),txt=el("textarea");txt.placeholder="Private internal note";const save=el("button","Save note");save.onclick=async()=>{if(!txt.value.trim())return;try{await api("note",{}, {contact_id:id,body:txt.value});await showContact(id)}catch(e){status(e.message)}};note.append(el("h2","Add internal note"),txt,save);content.append(note);
const task=el("section",undefined,"card"),title=el("input"),date=el("input"),add=el("button","Create follow-up");title.placeholder="Follow-up description";date.type="datetime-local";add.onclick=async()=>{try{await api("task",{}, {contact_id:id,title:title.value,due_at:date.value?new Date(date.value).toISOString():null});await showContact(id)}catch(e){status(e.message)}};task.append(el("h2","New follow-up"),title,date,add);content.append(task)}
catch(e){status(e.message)}}
</script><script src="./config.js"></script></body></html>
